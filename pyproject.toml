[project]
name = "opswatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jalberth Mosquera", email = "jmosquera2305@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.39",
]

[project.scripts]
opswatch = "opswatch:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
